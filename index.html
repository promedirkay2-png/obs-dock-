<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Overlay Remotes</title>
<style>
  :root {
    --bg: #0b0b0f;
    --on: #2ee6a6;
    --off: #ff4d5e;
    --text: #f5f5f7;
    --muted: #8a8a94;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    flex-wrap: wrap;
  }
  .item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .toggle {
    width: 64px;
    height: 32px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #fff;
    background: var(--off);
    transition: background 0.2s ease, transform 0.08s ease;
  }
  .toggle.on { background: var(--on); color: #06231a; }
  .toggle:active { transform: scale(0.93); }
  .toggle:disabled { opacity: 0.6; cursor: wait; }
</style>
</head>
<body>

  <div class="item">
    <span class="label">Overlay 1</span>
    <button class="toggle" id="btn1" onclick="toggle('btn1', API_1)">OFF</button>
  </div>

  <div class="item">
    <span class="label">Overlay 2</span>
    <button class="toggle" id="btn2" onclick="toggle('btn2', API_2)">OFF</button>
  </div>

<script>
  const API_1 = "https://app.overlays.uno/apiv2/controlapps/6uPYOUrzy6uguIjvNNRVXy/api";
  const API_2 = "https://app.overlays.uno/apiv2/controlapps/7ybDhSCHiYJbAjmzB4IAcq/api";

  // Real overlay instance ID for Overlay 1 (from its ShowOverlay example).
  // Overlay 2's real ID is unknown yet — using a placeholder until you send it.
  const ID_1 = "c71cf879-cfd5-40a8-a6f4-7fc509d3fa4d";
  const ID_2 = null; // TODO: needs Overlay 2's real overlay id

  async function toggle(btnId, apiUrl) {
    const btn = document.getElementById(btnId);
    btn.disabled = true;
    const realId = btnId === 'btn1' ? ID_1 : ID_2;

    if (!realId) {
      btn.textContent = 'NO ID';
      btn.disabled = false;
      return;
    }

    const payload = { command: "ToggleOverlay", id: realId };

    try {
      const res = await fetch(apiUrl, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        const isOn = btn.classList.toggle('on');
        btn.textContent = isOn ? 'ON' : 'OFF';
      } else {
        btn.textContent = 'ERR';
      }
    } catch (err) {
      btn.textContent = 'ERR';
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
