  .panel {
    width: 100%;
    height: 100%;
    max-width: 100%;
    background: linear-gradient(180deg, rgba(19,19,24,0.55), rgba(15,15,19,0.6));
    border: 1px solid var(--border);
    border-radius: clamp(10px, 2vw, 16px);
    padding: clamp(6px, 2vw, 12px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(4px);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 4px 10px 4px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .header-title {
    font-size: clamp(9px, 2.2vw, 10.5px);
    font-weight: 700;
    letter-spacing: 1.2px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .header-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--on);
    box-shadow: 0 0 8px var(--on);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: clamp(5px, 1.5vw, 8px);
    flex: 1;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: clamp(7px, 2vw, 10px);
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1.5vw, 10px);
    transition: background 0.2s ease, border-color 0.2s ease;
    min-width: 0;
  }
  .card:hover {
    background: var(--card-hover);
  }
  .card.active {
    border-color: rgba(52,211,153,0.35);
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .label {
    font-size: clamp(9.5px, 2.4vw, 11px);
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .indicator {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--off);
    box-shadow: 0 0 8px rgba(244,63,94,0.6);
    flex-shrink: 0;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }
  .indicator.on {
    background: var(--on);
    box-shadow: 0 0 8px rgba(52,211,153,0.65);
  }
  .indicator.pending {
    background: #fbbf24;
    box-shadow: 0 0 8px rgba(251,191,36,0.6);
    animation: blink 0.7s ease-in-out infinite;
  }
  .indicator.err {
    background: #fb923c;
    box-shadow: 0 0 8px rgba(251,146,60,0.6);
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .state-text {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.6px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .state-text.on { color: var(--on); }
  .state-text.err { color: #fb923c; }

  .action-btn {
    width: 100%;
    border: none;
    border-radius: 6px;
    padding: clamp(6px, 1.6vw, 9px) 0;
    font-size: clamp(7.5px, 1.8vw, 9px);
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #fff;
    background: var(--off);
    cursor: pointer;
    transition: background 0.2s ease, transform 0.08s ease, box-shadow 0.2s ease;
    box-shadow: 0 2px 8px rgba(244,63,94,0.25);
  }
  .action-btn.on {
    background: var(--on);
    color: #052e1e;
    box-shadow: 0 2px 8px rgba(52,211,153,0.3);
  }
  .action-btn:active {
    transform: scale(0.96);
  }
  .action-btn:disabled {
    opacity: 0.6;
    cursor: wait;
  }
  .action-btn.err {
    background: #fb923c;
    color: #2b1502;
    box-shadow: 0 2px 8px rgba(251,146,60,0.3);
  }
</style>
</head>
<body>

  <div class="panel">
    <div class="header">
      <span class="header-title">Overlay Control</span>
      <span class="header-dot"></span>
    </div>

    <div class="grid">
      <div class="card" id="cardTheme">
        <div class="card-top">
          <span class="label">Theme</span>
          <span class="indicator" id="indTheme"></span>
        </div>
        <button class="action-btn" id="btnTheme" onclick="toggle('Theme', API_THEME, ID_THEME)">OFF</button>
      </div>

      <div class="card" id="cardSocials">
        <div class="card-top">
          <span class="label">Socials</span>
          <span class="indicator" id="indSocials"></span>
        </div>
        <button class="action-btn" id="btnSocials" onclick="toggle('Socials', API_SOCIALS, ID_SOCIALS)">OFF</button>
      </div>

      <div class="card" id="cardLiveS">
        <div class="card-top">
          <span class="label">Live(S)</span>
          <span class="indicator" id="indLiveS"></span>
        </div>
        <button class="action-btn" id="btnLiveS" onclick="toggle('LiveS', API_LIVES, null)">OFF</button>
      </div>

      <div class="card" id="cardAnnonces">
        <div class="card-top">
          <span class="label">Annonces(S)</span>
          <span class="indicator" id="indAnnonces"></span>
        </div>
        <button class="action-btn" id="btnAnnonces" onclick="toggle('Annonces', API_ANNONCES, null)">OFF</button>
      </div>
    </div>
  </div>

<script>
  const API_THEME    = "https://app.overlays.uno/apiv2/controlapps/5VvVivOS2BmgqItxrtBznW/api";
  const API_SOCIALS  = "https://app.overlays.uno/apiv2/controlapps/2soOs2QoVNVk6a7kmEWp8Z/api";
  const API_LIVES    = "https://app.overlays.uno/apiv2/controlapps/3SrKbuFAUwKzwJqR834sFN/api";
  const API_ANNONCES = "https://app.overlays.uno/apiv2/controlapps/4adMqyhchYhOgNLKaDy1Ax/api";

  const ID_THEME    = "c71cf879-cfd5-40a8-a6f4-7fc509d3fa4d";
  const ID_SOCIALS  = "-NDrs33sSgLrqXCDcRLM";

  async function toggle(key, apiUrl, id) {
    const btn = document.getElementById('btn' + key);
    const ind = document.getElementById('ind' + key);
    const card = document.getElementById('card' + key);

    btn.disabled = true;
    btn.classList.remove('err');
    ind.classList.remove('err');
    ind.classList.add('pending');

    const payload = id ? { command: "ToggleOverlay", id: id } : { command: "ToggleOverlay" };

    try {
      const res = await fetch(apiUrl, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      ind.classList.remove('pending');

      if (res.ok) {
        const isOn = btn.classList.toggle('on');
        ind.classList.toggle('on', isOn);
        card.classList.toggle('active', isOn);
        btn.textContent = isOn ? 'ON' : 'OFF';
      } else {
        btn.classList.add('err');
        ind.classList.add('err');
        btn.textContent = 'ERROR';
      }
    } catch (err) {
      ind.classList.remove('pending');
      btn.classList.add('err');
      ind.classList.add('err');
      btn.textContent = 'ERROR';
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
